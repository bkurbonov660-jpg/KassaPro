name: ai_tols
description: AI Tols — ваш ИИ-агент на телефоне
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.2
  provider: ^6.1.2
  http: ^1.2.1
  permission_handler: ^11.3.0
  url_launcher: ^6.3.1
  device_apps: ^2.2.0
  speech_to_text: ^7.0.0
  file_picker: ^8.1.2
  path_provider: ^2.1.1
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0
  share_plus: ^10.1.1
  connectivity_plus: ^6.1.0

  # НОВЫЕ ЗАВИСИМОСТИ (исправленные)
  wifi_iot: ^0.3.0
  flutter_blue_plus: ^1.32.10
  torch_controller: ^2.0.1
  flutter_volume_controller: ^1.0.0   # вместо volume_controller
  android_intent_plus: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
