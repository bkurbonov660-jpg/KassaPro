name: sisms_photo
description: Каталог фотографий с описаниями
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.2
  provider: ^6.1.2
  image_picker: ^1.0.7
  path_provider: ^2.1.1
  intl: ^0.19.0
  permission_handler: ^11.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0
  file_picker: ^8.0.7         # совместимая версия
  path: ^1.9.0
  share_plus: ^10.0.0         # совместимая версия

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
