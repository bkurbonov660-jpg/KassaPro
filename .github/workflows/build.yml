name: Build Master & Client APK
on:
  push: { branches: [ main ] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.32.x' }
      - name: Create Native Shell
        run: flutter create --org com.master --project-name master_and_client --platforms=android .
      - name: Overwrite Native Files
        run: git checkout HEAD -- android/ || true
      - name: Configure build.gradle.kts
        run: |
          cat > android/app/build.gradle.kts << 'GRADLE_EOF'
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }
          android {
              namespace = "com.master.master_and_client"
              compileSdk = 35
              ndkVersion = "27.0.12077973"
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_11
                  targetCompatibility = JavaVersion.VERSION_11
                  isCoreLibraryDesugaringEnabled = true
              }
              kotlinOptions { jvmTarget = "11" }
              defaultConfig {
                  applicationId = "com.master.master_and_client"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
                  multiDexEnabled = true
              }
              buildTypes { release { signingConfig = signingConfigs.getByName("debug") } }
          }
          flutter { source = "../.." }
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          GRADLE_EOF
      - name: Build Release APK
        run: |
          flutter pub get
          flutter build apk --release
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Master_and_Client_APK_v3.5
          path: build/app/outputs/flutter-apk/app-release.apk
