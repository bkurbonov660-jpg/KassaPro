name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache gradle and NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            /usr/local/lib/android/sdk/ndk
          key: gradle-ndk-v1

      - name: Cache keystore
        uses: actions/cache@v4
        with:
          path: android/app/dorama-release.jks
          key: dorama-release-key-v1

      - name: Flutter create android
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --org com.dorama --project-name doramapulse --platforms android .
          fi
          rm -rf test
          mkdir -p assets/icon
          touch assets/icon/.keep

      - name: Make keystore
        run: |
          if [ ! -f android/app/dorama-release.jks ]; then
            keytool -genkeypair -v -keystore android/app/dorama-release.jks -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 -alias dorama -storepass dorama123 -keypass dorama123 -dname "CN=DoramaPulse, OU=Dev, O=Personal, L=City, ST=State, C=KR"
          fi
          printf 'storePassword=dorama123\nkeyPassword=dorama123\nkeyAlias=dorama\nstoreFile=dorama-release.jks\n' > android/key.properties

      - name: Patch android
        run: bash tool/patch_android.sh

      - name: App icon
        continue-on-error: true
        run: bash tool/make_icon.sh

      - name: Bump version
        run: |
          sed -i "s/^version: .*/version: 2.8.${{ github.run_number }}+${{ github.run_number }}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: pub get
        run: flutter pub get

      - name: Embed latest catalog
        continue-on-error: true
        run: |
          if curl -fsSL --retry 2 --max-time 120 -o /tmp/seed.json "https://raw.githubusercontent.com/${{ github.repository }}/data/catalog.json" && python3 -c "import json,sys; d=json.load(open('/tmp/seed.json')); sys.exit(0 if len(d.get('dramas', [])) > 200 else 1)"; then
            cp /tmp/seed.json assets/seed_catalog.json
            ls -la assets/seed_catalog.json
          else
            echo "Свежей базы на сервере пока нет - приложение скачает её само при первом запуске"
          fi

      - name: Build release APK
        env:
          OR_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: |
          if [ -n "$OR_KEY" ]; then
            flutter build apk --release --split-per-abi --target-platform android-arm64 --dart-define=OPENROUTER_KEY="$OR_KEY"
          else
            flutter build apk --release --split-per-abi --target-platform android-arm64
          fi

      - name: Verify and name APK
        run: |
          set -e
          N=${{ github.run_number }}
          SRC=build/app/outputs/flutter-apk
          ls -la "$SRC"
          mkdir -p out
          cp "$SRC/app-arm64-v8a-release.apk" "out/DoramaPulse-arm64-v$N.apk"
          AS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          cd out
          for f in *.apk; do
            echo "== $f"
            unzip -tq "$f"
            "$AS" verify --print-certs "$f" | head -n 3
          done
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "Файл для установки: DoramaPulse-arm64-v$N.apk"
            echo "Скачивайте напрямую из Assets, без zip."
            echo "Размер и SHA256 смотрите в SHA256SUMS.txt"
          } > NOTES.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoramaPulse-apk
          path: out/*.apk
          compression-level: 0
          if-no-files-found: error

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.8.${{ github.run_number }}
          name: Дорама Пульс — сборка ${{ github.run_number }}
          body_path: out/NOTES.md
          files: |
            out/*.apk
            out/SHA256SUMS.txt
          make_latest: true
