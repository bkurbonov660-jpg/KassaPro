name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache keystore
        uses: actions/cache@v4
        with:
          path: android/app/dorama-release.jks
          key: dorama-release-key-v1

      - name: Flutter create android
        run: |
          if [ ! -d android ]; then
            flutter create --org com.dorama --project-name doramapulse --platforms android .
          fi

      - name: Make keystore
        run: |
          if [ ! -f android/app/dorama-release.jks ]; then
            keytool -genkeypair -v -keystore android/app/dorama-release.jks -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 -alias dorama -storepass dorama123 -keypass dorama123 -dname "CN=DoramaPulse, OU=Dev, O=Personal, L=City, ST=State, C=KR"
          fi
          printf 'storePassword=dorama123\nkeyPassword=dorama123\nkeyAlias=dorama\nstoreFile=dorama-release.jks\n' > android/key.properties

      - name: Patch manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$M"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"
          fi
          sed -i 's#android:label="[^"]*"#android:label="Дорама Пульс"#' "$M"

      - name: Patch gradle signing
        run: |
          F=android/app/build.gradle
          if [ -f "$F" ]; then
            if ! grep -q 'keystoreProperties' "$F"; then
              sed -i '1i def keystoreProperties = new Properties()\ndef keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) { keystoreProperties.load(new FileInputStream(keystorePropertiesFile)) }\n' "$F"
            fi
            if ! grep -q 'signingConfigs' "$F"; then
              sed -i 's/android {/android {\n    signingConfigs {\n        release {\n            keyAlias keystoreProperties["keyAlias"]\n            keyPassword keystoreProperties["keyPassword"]\n            storeFile file(keystoreProperties["storeFile"])\n            storePassword keystoreProperties["storePassword"]\n        }\n    }/' "$F"
            fi
            sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/g' "$F"
          fi

      - name: Bump version
        run: |
          sed -i "s/^version: .*/version: 2.2.${{ github.run_number }}+${{ github.run_number }}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: pub get
        run: flutter pub get

      - name: Build release APK
        env:
          OR_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: |
          if [ -n "$OR_KEY" ]; then
            flutter build apk --release --dart-define=OPENROUTER_KEY=$OR_KEY
          else
            flutter build apk --release
          fi

      - name: Rename APK
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/DoramaPulse-Korea-v${{ github.run_number }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoramaPulse-Korea-apk
          path: out/*.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.${{ github.run_number }}
          name: Дорама Пульс — Корея — сборка ${{ github.run_number }}
          files: out/*.apk
          make_latest: true
