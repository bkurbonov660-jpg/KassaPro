name: Build GoalFlow APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Create Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --org com.goalflow --project-name goalflow --platforms android .
          fi

      - name: Patch AndroidManifest (permissions)
        run: |
          FILE=android/app/src/main/AndroidManifest.xml
          if ! grep -q "POST_NOTIFICATIONS" "$FILE"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$FILE"
          fi

      - name: Patch app/build.gradle (multidex + desugaring)
        run: |
          python3 <<'PY'
import re, os
p = 'android/app/build.gradle'
s = open(p).read()

# 1. multiDexEnabled true — внутрь defaultConfig
if 'multiDexEnabled' not in s:
    s = re.sub(r'(defaultConfig\s*\{)', r'\1\n        multiDexEnabled true', s, count=1)

# 2. coreLibraryDesugaringEnabled true — внутрь compileOptions
if 'coreLibraryDesugaringEnabled' not in s:
    s = re.sub(r'(compileOptions\s*\{)', r'\1\n        coreLibraryDesugaringEnabled true', s, count=1)

# 3. coreLibraryDesugaring dep — внутрь dependencies
if 'coreLibraryDesugaring' not in s:
    s = re.sub(r'(dependencies\s*\{)',
               r'\1\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"',
               s, count=1)

open(p,'w').write(s)
print("===== FINAL app/build.gradle =====")
print(s)
PY

      - name: Pub get
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK release
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/GoalFlow-v7.1.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoalFlow-APK
          path: dist/GoalFlow-v7.1.apk

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v7.1.${{ github.run_number }}
          name: GoalFlow v7.1.${{ github.run_number }}
          body: |
            Автосборка GoalFlow v7.1
            - multidex + desugaring fix
            - рекомендации, уведомления, 5 валют
          files: dist/GoalFlow-v7.1.apk
