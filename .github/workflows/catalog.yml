name: Update catalog

on:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: [ main ]
    paths:
      - 'tool/build_catalog.dart'
      - 'lib/**'
      - '.github/workflows/catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Keep signing key cache alive
        uses: actions/cache/restore@v4
        with:
          path: android/app/dorama-release.jks
          key: dorama-release-key-v1

      - name: Cache translated catalog
        uses: actions/cache@v4
        with:
          path: assets/seed_catalog.json
          key: seed-${{ github.run_id }}
          restore-keys: |
            seed-

      - name: pub get
        run: flutter pub get

      - name: Build catalog
        timeout-minutes: 60
        env:
          OR_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: |
          DEFS=""
          if [ -n "$OR_KEY" ]; then DEFS="-DOPENROUTER_KEY=$OR_KEY"; fi
          dart run $DEFS tool/build_catalog.dart
          ls -la assets/seed_catalog.json

      - name: Publish to data branch
        run: |
          python3 -c "import json,sys; d=json.load(open('assets/seed_catalog.json')); n=len(d.get('dramas', [])); sys.exit('catalog too small') if n < 200 else open('/tmp/meta.json','w').write(json.dumps({'built': d['built'], 'count': n}))"
          mkdir -p /tmp/pub
          cp assets/seed_catalog.json /tmp/pub/catalog.json
          cp /tmp/meta.json /tmp/pub/meta.json
          if [ -f assets/streams.json ]; then
            cp assets/streams.json /tmp/pub/streams.json
          fi
          if [ -f /tmp/actors_awards.json ]; then
            cp /tmp/actors_awards.json /tmp/pub/actors_awards.json
          fi
          if [ -f assets/remote_default.json ]; then
            cp assets/remote_default.json /tmp/pub/remote.json
          elif curl -fsSL --retry 2 --max-time 60 -o /tmp/remote.json "https://raw.githubusercontent.com/${{ github.repository }}/data/remote.json" && python3 -c "import json; json.load(open('/tmp/remote.json'))"; then
            cp /tmp/remote.json /tmp/pub/remote.json
          else
            echo '{"notice":"","fix":{"titles":{},"summaries":{}},"config":{}}' > /tmp/pub/remote.json
          fi
          cat /tmp/pub/meta.json
          cd /tmp/pub
          git init -q -b data
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -qm "catalog $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
